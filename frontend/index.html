<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAPI Security Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-top: 0; }
    .btn { background: #0284c7; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 0.5rem; }
    .btn:hover { background: #0369a1; }
    .badge { padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }
    .status-pass { background: #15803d; }
    .status-inconclusive { background: #b45309; }
    .status-fail { background: #b91c1c; }
    pre { background: #020617; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #a5f3fc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>SentinelAPI Scanner Dashboard</h1>
      <p>Status: <span id="overall-status" class="badge status-inconclusive">LOADING</span></p>
      <p>Last Checked (UTC): <strong id="last-checked">—</strong></p>
      <button class="btn" onclick="runScan()">Run Scan</button>
      <button class="btn" onclick="fetchReport()">Refresh Report</button>
    </div>

    <div class="card">
      <h2>Scan Details</h2>
      <pre id="report-output">Fetching report...</pre>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    async function fetchReport() {
      try {
        const res = await fetch('/report');
        const data = await res.json();
        document.getElementById('last-checked').textContent = data.checked_at_utc || '—';
        const badge = document.getElementById('overall-status');
        badge.textContent = data.overall_result || 'UNKNOWN';
        badge.className = 'badge ' + (
          data.overall_result === 'PASS' ? 'status-pass' :
          data.overall_result === 'FAIL' ? 'status-fail' : 'status-inconclusive'
        );
        document.getElementById('report-output').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('report-output').textContent = 'Error loading report: ' + err;
      }
    }

    async function runScan() {
      const btn = event.target;
      btn.textContent = 'Scanning...';
      btn.disabled = true;
      try {
        await fetch('/scan', { method: 'POST' });
        await fetchReport();
      } catch (err) {
        alert('Scan failed: ' + err);
      } finally {
        btn.textContent = 'Run Scan';
        btn.disabled = false;
      }
    }

    fetchReport();
  </script>
</body>
</html>
