<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAPI Security Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h1 { color: #58a6ff; margin-top: 0; font-size: 1.6rem; }
    h2 { color: #f0f6fc; font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #21262d; padding-bottom: 0.5rem; }
    .meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .label { font-weight: 600; color: #8b949e; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .status-pass { background: #238636; color: #fff; }
    .status-inconclusive { background: #d29922; color: #fff; }
    .status-fail { background: #da3633; color: #fff; }
    .btn-group { display: flex; gap: 0.75rem; margin-top: 1rem; }
    button {
      background: #238636;
      color: #fff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #21262d; }
    button:hover { opacity: 0.9; }
    .check-card {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 0.75rem;
    }
    .check-header { display: flex; justify-content: space-between; align-items: center; }
    .check-title { font-weight: 600; color: #e6edf3; }
    .check-desc { color: #8b949e; font-size: 0.9rem; margin: 0.5rem 0 0 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>SentinelAPI Scanner Dashboard</h1>
      <div class="meta-row">
        <div>
          <span class="label">Checked at (UTC): </span>
          <span id="checked-at" style="color: #e6edf3; font-weight: 500;">—</span>
        </div>
        <div>
          <span class="label">Overall Result: </span>
          <span id="overall-badge" class="badge status-inconclusive">LOADING</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="scan-btn" onclick="runScan()">Run scan</button>
        <button class="secondary" onclick="fetchReport()">Refresh result</button>
      </div>
    </div>

    <div class="card">
      <h2>Scan Checks</h2>
      <div id="checks-container">No checks recorded yet.</div>
    </div>
  </div>

  <script>
    async function fetchReport() {
      try {
        const res = await fetch('/report');
        const data = await res.json();
        
        document.getElementById('checked-at').textContent = data.checked_at_utc || '—';
        
        const badge = document.getElementById('overall-badge');
        const status = (data.overall_result || 'INCONCLUSIVE').toUpperCase();
        badge.textContent = status;
        badge.className = 'badge ' + (
          status === 'PASS' ? 'status-pass' :
          status === 'FAIL' ? 'status-fail' : 'status-inconclusive'
        );

        const container = document.getElementById('checks-container');
        if (data.checks && data.checks.length > 0) {
          container.innerHTML = data.checks.map(c => `
            <div class="check-card">
              <div class="check-header">
                <span class="check-title">${c.name || 'Check'}</span>
                <span class="badge ${c.status === 'PASS' ? 'status-pass' : c.status === 'FAIL' ? 'status-fail' : 'status-inconclusive'}">${c.status || 'INFO'}</span>
              </div>
              ${c.details ? `<p class="check-desc">${c.details}</p>` : ''}
            </div>
          `).join('');
        } else if (data.error) {
          container.innerHTML = `<p style="color: #f85149;">${data.error}</p>`;
        } else {
          container.innerHTML = '<p style="color: #8b949e;">No scan checks found in report.</p>';
        }
      } catch (err) {
        document.getElementById('checks-container').innerHTML = '<p style="color: #f85149;">Error loading scan report.</p>';
      }
    }

    async function runScan() {
      const btn = document.getElementById('scan-btn');
      btn.textContent = 'Running...';
      btn.disabled = true;
      try {
        await fetch('/scan', { method: 'POST' });
        await fetchReport();
      } catch (e) {
        alert('Scan trigger failed');
      } finally {
        btn.textContent = 'Run scan';
        btn.disabled = false;
      }
    }

    fetchReport();
  </script>
</body>
</html>
