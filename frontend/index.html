<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAPI Security Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 950px; margin: 0 auto; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h1 { color: #58a6ff; margin-top: 0; font-size: 1.6rem; }
    h2 { color: #f0f6fc; font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #21262d; padding-bottom: 0.5rem; }
    .meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .label { font-weight: 600; color: #8b949e; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-pass { background: #238636; color: #fff; }
    .status-inconclusive { background: #d29922; color: #fff; }
    .status-fail { background: #da3633; color: #fff; }
    .btn-group { display: flex; gap: 0.75rem; margin-top: 1rem; }
    button {
      background: #238636;
      color: #fff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #21262d; }
    button:hover { opacity: 0.9; }

    /* Detailed Check Cards */
    .check-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1.2rem;
      margin-top: 1rem;
    }
    .check-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .check-title { font-size: 1.05rem; font-weight: 600; color: #e6edf3; }
    .check-desc { color: #8b949e; font-size: 0.95rem; margin-bottom: 0.75rem; line-height: 1.4; }
    
    .check-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.5rem 1rem;
      background: #161b22;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid #21262d;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .meta-item { display: flex; flex-direction: column; }
    .meta-key { color: #8b949e; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; }
    .meta-val { color: #f0f6fc; font-family: monospace; word-break: break-all; margin-top: 2px; }

    details {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-top: 0.5rem;
    }
    summary {
      cursor: pointer;
      color: #58a6ff;
      font-size: 0.85rem;
      font-weight: 600;
      user-select: none;
    }
    pre {
      background: #020617;
      padding: 0.75rem;
      border-radius: 4px;
      color: #79c0ff;
      font-size: 0.8rem;
      overflow-x: auto;
      margin-top: 0.5rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>SentinelAPI Scanner Dashboard</h1>
      <div class="meta-row">
        <div>
          <span class="label">Checked at (UTC): </span>
          <span id="checked-at" style="color: #e6edf3; font-weight: 500;">—</span>
        </div>
        <div>
          <span class="label">Overall Result: </span>
          <span id="overall-badge" class="badge status-inconclusive">LOADING</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="scan-btn" onclick="runScan()">Run scan</button>
        <button class="secondary" onclick="fetchReport()">Refresh result</button>
      </div>
    </div>

    <div class="card">
      <h2>Scan Checks & Findings</h2>
      <div id="checks-container">Loading checks...</div>
    </div>
  </div>

  <script>
    function renderCheckCard(c) {
      const status = (c.status || c.result || 'INFO').toUpperCase();
      const statusClass = status === 'PASS' ? 'status-pass' : status === 'FAIL' ? 'status-fail' : 'status-inconclusive';

      // Collect recognized metadata fields
      const meta = [];
      if (c.endpoint || c.url) meta.push({ key: 'Endpoint', val: c.endpoint || c.url });
      if (c.method) meta.push({ key: 'Method', val: c.method });
      if (c.status_code || c.http_status) meta.push({ key: 'HTTP Status', val: c.status_code || c.http_status });
      if (c.severity) meta.push({ key: 'Severity', val: c.severity });
      if (c.type) meta.push({ key: 'Type', val: c.type });

      const metaHtml = meta.length > 0 ? `
        <div class="check-meta-grid">
          ${meta.map(m => `
            <div class="meta-item">
              <span class="meta-key">${m.key}</span>
              <span class="meta-val">${m.val}</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      // Detailed description / message
      const desc = c.details || c.description || c.message || '';
      const descHtml = desc ? `<div class="check-desc">${desc}</div>` : '';

      // Expandable section for payload, evidence, or raw check payload
      const extraData = Object.assign({}, c);
      delete extraData.name;
      delete extraData.status;
      delete extraData.result;
      delete extraData.details;
      delete extraData.description;
      delete extraData.message;

      const rawJson = Object.keys(extraData).length > 0 ? `
        <details>
          <summary>View Diagnostic / Technical Details</summary>
          <pre>${JSON.stringify(extraData, null, 2)}</pre>
        </details>
      ` : '';

      return `
        <div class="check-card">
          <div class="check-header">
            <span class="check-title">${c.name || c.id || 'Unnamed Security Check'}</span>
            <span class="badge ${statusClass}">${status}</span>
          </div>
          ${descHtml}
          ${metaHtml}
          ${rawJson}
        </div>
      `;
    }

    async function fetchReport() {
      try {
        const res = await fetch('/report');
        const data = await res.json();
        
        document.getElementById('checked-at').textContent = data.checked_at_utc || '—';
        
        const badge = document.getElementById('overall-badge');
        const status = (data.overall_result || 'INCONCLUSIVE').toUpperCase();
        badge.textContent = status;
        badge.className = 'badge ' + (
          status === 'PASS' ? 'status-pass' :
          status === 'FAIL' ? 'status-fail' : 'status-inconclusive'
        );

        const container = document.getElementById('checks-container');
        if (data.checks && data.checks.length > 0) {
          container.innerHTML = data.checks.map(renderCheckCard).join('');
        } else if (data.error) {
          container.innerHTML = `<p style="color: #f85149; font-weight: 500;">${data.error}</p>`;
        } else {
          container.innerHTML = '<p style="color: #8b949e;">No scan checks recorded in scan_report.json.</p>';
        }
      } catch (err) {
        document.getElementById('checks-container').innerHTML = '<p style="color: #f85149;">Error loading scan report.</p>';
      }
    }

    async function runScan() {
      const btn = document.getElementById('scan-btn');
      btn.textContent = 'Running...';
      btn.disabled = true;
      try {
        await fetch('/scan', { method: 'POST' });
        await fetchReport();
      } catch (e) {
        alert('Scan trigger failed');
      } finally {
        btn.textContent = 'Run scan';
        btn.disabled = false;
      }
    }

    fetchReport();
  </script>
</body>
</html>
</html>
